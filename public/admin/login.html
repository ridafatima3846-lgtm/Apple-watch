<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – WatchLux</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;max-width:400px;width:90%;text-align:center;">
        <div style="font-size:48px;margin-bottom:16px;">⌚</div>
        <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:4px;">Watch<span style="color:var(--primary);">Lux</span></h1>
        <p style="color:var(--gray);font-size:13px;margin-bottom:24px;">Admin Panel</p>
        <div id="login-error" style="color:#ef4444;font-size:13px;margin-bottom:12px;display:none;">Wrong password</div>
        <input type="password" id="admin-pass" class="form-input" placeholder="Enter admin password" style="margin-bottom:16px;" onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()" class="btn-primary" style="width:100%;justify-content:center;">Login</button>
    </div>
    <script>
        function login() {
            const pass = document.getElementById('admin-pass').value;
            const stored = localStorage.getItem('watchlux_admin_pass') || 'admin123';
            if (pass === stored) {
                localStorage.setItem('watchlux_admin_logged', 'true');
                const url = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
                window.location.href = url;
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }
        if (localStorage.getItem('watchlux_admin_logged') === 'true') {
            const url = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
            window.location.href = url;
        }
    </script>
</body>
</html>
