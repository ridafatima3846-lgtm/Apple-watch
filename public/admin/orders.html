<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders – WatchLux Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌚</text></svg>">
</head>
<body>
    <div class="admin-sidebar">
        <h2>Watch<span>Lux</span> Admin</h2>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="products.html">📦 Products</a>
        <a href="add-product.html">➕ Add Product</a>
        <a href="orders.html" class="active">📋 Orders</a>
        <a href="reviews.html">⭐ Reviews</a>
        <a href="chat.html">💬 Chat</a>
        <a href="../index.html" style="margin-top:40px;border-top:1px solid rgba(0,0,0,0.06);padding-top:20px;">← Back to Store</a>
    </div>

    <div class="admin-main">
        <div class="admin-header">
            <h1>Orders</h1>
            <div style="position:relative;">
                <input type="text" id="order-search" class="form-input" placeholder="Search orders..." style="width:250px;padding:10px 16px;">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>City</th>
                        <th>Products</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-orders"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
